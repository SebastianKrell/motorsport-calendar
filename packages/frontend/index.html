<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Motorsport-Termine und Übertragungen für GT-, Langstrecken- und Formelserien in deutscher Zeit."
    />
    <meta name="theme-color" content="#7a1f1f" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Motorsport-Kalender" />
    <meta
      property="og:description"
      content="Renntermine, Session-Zeiten und offizielle Übertragungslinks auf einen Blick."
    />
    <meta property="og:url" content="https://sebastiankrell.github.io/motorsport-calendar/" />
    <link rel="canonical" href="https://sebastiankrell.github.io/motorsport-calendar/" />
    <link rel="icon" href="/motorsport-calendar/favicon.svg" type="image/svg+xml" />
    <title>Motorsport-Kalender</title>
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.lang = localStorage.getItem('language') === 'en' ? 'en' : 'de';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
