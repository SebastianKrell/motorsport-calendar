# super_gt: bewusst kein Eintrag. Recherche 2026-08-22 fand keinen
# verlässlichen kostenlosen internationalen Stream -- Hauptsender ist
# J SPORTS (Japan, national). Motorsport.tv (bisherige engl. Streams) wird
# eingestellt, Nachfolger RACER+ ist kostenpflichtig und primär US-fokussiert,
