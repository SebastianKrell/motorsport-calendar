# Sender-Mapping Deutschland — handgepflegt, s. CLAUDE.md.
# Struktur pro Serie: "default" gilt für alle Sessions, "events" erlaubt
# Ausnahmen für einzelne Events (Teilstring-Match gegen eventName).
# verifiedAt: Datum der letzten manuellen Prüfung (YYYY-MM-DD).
# unverified: true markiert Einträge, die laut CLAUDE.md vor Saisonstart
# noch bestätigt werden müssen.

fe:
  default:
    broadcasters:
      - name: DF1
        type: free-tv
        url: https://df1.de
    verifiedAt: "2026-08-21"

wec:
  default:
    broadcasters:
      - name: Eurosport
        type: pay-tv
      - name: HBO Max / discovery+
        type: streaming
      - name: FIAWEC+
        type: streaming-paid
    verifiedAt: "2026-08-21"
  events:
    # Sprachunabhängiger Teilstring -- ICS lieferte "24 Heures du Mans"
    # (franz.), der WEC-Scraper (fiawec.com) liefert "24 Hours of Le Mans".
    - match: "Le Mans"
      broadcasters:
        - name: Eurosport 1
          type: free-tv
        - name: RTL Nitro
          type: free-tv
        - name: RTL+
          type: streaming
        - name: ServusTV On
          type: streaming
        - name: FIAWEC+
          type: streaming-paid
      verifiedAt: "2026-08-21"

elms:
  default:
    broadcasters:
      # Seit 2026 laufen alle ELMS-Rennen kostenlos (Konto nötig, kein
      # Geoblocking) auf FIAWEC+ statt wie zuvor nur auf YouTube.
      - name: FIAWEC+
        type: free-stream
        url: https://plus.fiawec.com/en/european-le-mans-series
      - name: "YouTube (@EuropeanLeMansSeriesOfficial)"
        type: free-stream
        url: https://www.youtube.com/@EuropeanLeMansSeriesOfficial
    verifiedAt: "2026-08-28"

michelin_le_mans_cup:
  default:
    broadcasters:
      - name: "YouTube (@LeMansCup)"
        type: free-stream
        url: https://www.youtube.com/@LeMansCup
    verifiedAt: "2026-08-29"

