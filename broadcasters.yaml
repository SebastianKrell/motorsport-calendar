igtc:
  default:
    broadcasters:
      - name: "GT World (YouTube)"
        type: free-stream
        url: https://www.youtube.com/@GTWorld
    verifiedAt: "2026-08-28"
  events:
    # Kronjuwel Nürburgring 24h hat abweichend deutsches Free-TV, s. CLAUDE.md
    # Sonderfall-Logik bei Le Mans (analog: nationaler Sender + Stream extra).
    - match: "Nürburgring"
      broadcasters:
        - name: RTL Nitro
          type: free-tv
        - name: 24h-rennen.de
          type: free-stream
      verifiedAt: "2026-08-22"

